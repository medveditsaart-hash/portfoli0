<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kate Medvid — Graphic Design Portfolio</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Bricolage Grotesque', sans-serif;
            background: #0f1e14 url('Paris_love.jpg') center/cover fixed no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #e2e8e4;
            padding: 12px;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 15, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1;
        }

        .folder-container {
            position: relative;
            width: 560px;
            max-width: 100%;
            z-index: 10;
        }

        /* ПАНЕЛЬ ВКЛАДОК */
        .folder-tabs {
            display: flex;
            position: relative;
            z-index: 2;
            top: 1px;
            align-items: flex-end;
            width: 100%;
            box-sizing: border-box;
            padding-right: 20px;
        }

        .folder-tabs > *:nth-child(1) { z-index: 4; }
        .folder-tabs > *:nth-child(2) { z-index: 3; }
        .folder-tabs > *:nth-child(3) { z-index: 2; }
        .folder-tabs > *:nth-child(4) { z-index: 1; }

        .tab-btn {
            position: relative;
            background: rgba(220, 228, 212, 0.42);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-bottom: none;
            padding: 9px 8px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: #0c2014;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s ease;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            flex: 1 1 0px;
            min-width: 0;
            margin-left: -8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab-btn:first-child {
            margin-left: 0;
        }

        .tab-btn.has-controls {
            padding-left: 8px;
            justify-content: flex-start;
        }

        .window-controls {
            display: inline-flex;
            gap: 4px;
            flex-shrink: 0;
            margin-right: 4px;
        }

        .control-btn {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-block;
        }

        .close { background: #ff5f56; border: 1px solid #e0443e; }
        .minimize { background: #ffbd2e; border: 1px solid #dea123; }
        .maximize { background: #27c93f; border: 1px solid #1aab29; }

        .tab-btn:hover {
            z-index: 10 !important;
            background: rgba(240, 245, 235, 0.65);
        }

        .tab-icon {
            width: 12px;
            height: 12px;
            stroke: #0c2014;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.85;
            pointer-events: none;
            flex-shrink: 0;
        }

        .window {
            position: relative;
            background: rgba(230, 235, 222, 0.32);
            backdrop-filter: blur(25px) saturate(140%);
            -webkit-backdrop-filter: blur(25px) saturate(140%);
