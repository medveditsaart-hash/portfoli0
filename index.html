<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kate Medvid — Graphic Design Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Bricolage Grotesque', sans-serif;
            background: #0f1e14 url('https://lh3.googleusercontent.com/d/1jVOpeA7ibwDG003QexeKxPM8OCghFJAz') center/cover fixed no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #e2e8e4;
            padding: 12px;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 15, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1;
        }

        .folder-container {
            position: relative;
            width: 560px;
            max-width: 100%;
            z-index: 10;
        }

        /* ПАНЕЛЬ ВКЛАДОК: ЛИШЕ НАЗВИ ПРОЄКТІВ */
        .folder-tabs {
            display: flex;
            position: relative;
            z-index: 2;
            top: 1px;
            align-items: flex-end;
            width: 100%;
            box-sizing: border-box;
        }

        .folder-tabs > *:nth-child(1) { z-index: 3; }
        .folder-tabs > *:nth-child(2) { z-index: 2; }
        .folder-tabs > *:nth-child(3) { z-index: 1; }

        .tab-btn {
            position: relative;
            background: rgba(220, 228, 212, 0.42);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-bottom: none;
            padding: 9px 8px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: #0c2014;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s ease;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            flex: 1 1 0px;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab-btn:not(:first-child) {
            margin-left: -8px;
        }

        .tab-btn:hover {
            z-index: 10 !important;
            background: rgba(240, 245, 235, 0.6);
        }

        .tab-icon {
            width: 12px;
            height: 12px;
            stroke: #0c2014;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.85;
            pointer-events: none;
            flex-shrink: 0;
        }

        .window {
            position: relative;
            background: rgba(230, 235, 222, 0.32);
            backdrop-filter: blur(25px) saturate(140%);
            -webkit-backdrop-filter: blur(25px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            border-top-left-radius: 0px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45),
                        inset 0 1px 1px rgba(255, 255, 255, 0.6);
            overflow: hidden;
            z-index: 1;
            width: 100%;
        }

        .window-body {
            padding: 32px 28px 28px 28px;
            text-align: center;
        }

        /* МЕТА-ІНФОРМАЦІЯ БЕЗ РОКУ 2026 */
        .meta-info {
            display: flex;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #122b1c;
            border-bottom: 1px dashed rgba(18, 43, 28, 0.3);
            padding-bottom: 12px;
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        .divider-line {
            border-bottom: 1px dashed rgba(18, 43, 28, 0.3);
            margin: 28px 0;
            width: 100%;
        }

        .hero-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 4.2rem;
            font-weight: 300;
            color: #0e3019;
            line-height: 1.02;
            letter-spacing: -0.5px;
        }

        .hero-subtitle {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 1.05rem;
            letter-spacing: 2.5px;
            color: #122b1c;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* ФУТЕР З КНОПКОЮ ABOUT В СТИЛІ ЕМАІЛ ТА ЛІНКЕДІН */
        .window-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 16px;
            border-top: 1px solid rgba(18, 43, 28, 0.25);
            font-size: 0.75rem;
            font-weight: 700;
            color: #0c2014;
        }

        .footer-btn, .contacts-links a {
            font-family: 'Bricolage Grotesque', sans-serif;
            color: #09170e;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.45);
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
        }

        .footer-btn:hover, .contacts-links a:hover {
            background: #0e3019;
            color: #f0f5ed;
        }

        .contacts-links a {
            margin-left: 6px;
        }

        /* POPUP WINDOWS */
        .pop-window {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            max-width: 94vw;
            max-height: 85vh;
            z-index: 100;
            background: rgba(235, 240, 230, 0.96);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        .pop-window.active {
            display: flex;
            flex-direction: column;
        }

        .pop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.45);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            font-size: 0.8rem;
            font-weight: 700;
            color: #0c2014;
            cursor: move;
            flex-shrink: 0;
        }

        .close-pop-btn {
            background: #ff5f56;
            border: 1px solid #e0443e;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
        }

        .pop-body {
            padding: 20px 24px;
            color: #122b1c;
            overflow-y: auto;
            text-align: left;
            user-select: text;
            -webkit-overflow-scrolling: touch;
        }

        .pop-body::-webkit-scrollbar {
            width: 6px;
        }
        .pop-body::-webkit-scrollbar-thumb {
            background: rgba(18, 43, 28, 0.3);
            border-radius: 3px;
        }

        .pop-body h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 300;
            margin-bottom: 6px;
            color: #0e3019;
            text-align: center;
        }

        .pop-body p.pop-desc {
            text-align: center;
            font-size: 0.88rem;
            color: #21422f;
            margin-bottom: 16px;
            opacity: 0.9;
        }

        /* ПОВНОЕКРАННИЙ РЕЖИМ ДЛЯ ПРОЄКТІВ (BEHANCE STYLE) */
        .pop-window.full-screen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            top: 0 !important;
            left: 0 !important;
            transform: none !important;
            border-radius: 0 !important;
            border: none !important;
            background: #f4f5f1;
        }

        .pop-header.project-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            background: rgba(245, 247, 242, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            cursor: default;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .project-author-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .project-author-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .project-title-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .project-title-text strong {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            color: #0c2014;
            line-height: 1.2;
        }

        .project-title-text span {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 0.74rem;
            color: #4a5d50;
            font-weight: 500;
        }

        .pop-body.project-body {
            padding: 0;
            margin: 0;
            width: 100%;
        }

        /* БЕХАНС ФОРМАТ ДЛЯ ІЛЮСТРАЦІЙ */
        .behance-feed {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 0;
            margin: 0;
            padding: 0;
        }

        .behance-feed img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            border: none;
        }

        .pop-gif {
            width: 90px;
