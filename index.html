<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kate Medvid — Graphic Design Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Bricolage Grotesque', sans-serif;
            background: #0f1e14 url('https://lh3.googleusercontent.com/d/1jVOpeA7ibwDG003QexeKxPM8OCghFJAz') center/cover fixed no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #e2e8e4;
            padding: 12px;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 15, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1;
        }

        .folder-container {
            position: relative;
            width: 560px;
            max-width: 100%;
            z-index: 10;
        }

        /* КОНТЕЙНЕР ВКЛАДОК */
        .folder-tabs {
            display: flex;
            position: relative;
            z-index: 2;
            top: 1px;
            align-items: flex-end;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            padding-right: 12px; /* Безбезпечний відступ від правого края папки */
        }

        /* Z-INDEX ДЛЯ НАКЛАДАННЯ ЗЛІВА НАПРАВО */
        .folder-tabs > *:nth-child(1) { z-index: 4; }
        .folder-tabs > *:nth-child(2) { z-index: 3; }
        .folder-tabs > *:nth-child(3) { z-index: 2; }
        .folder-tabs > *:nth-child(4) { z-index: 1; }

        /* ВІДПОШИРЕНА ТА ЗМЕНШЕНА ПІДПАПКА ABOUT */
        .left-tab-group {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(230, 235, 222, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-bottom: none;
            padding: 7px 6px; /* Зменшено внутрішні поля */
            border-top-left-radius: 12px;
            border-top-right-radius: 10px;
            gap: 4px; /* Компактний проміжок між кнопками та ABOUT */
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            flex: 0 0 auto;
            min-width: 0;
            overflow: hidden;
        }

        .window-controls {
            display: flex;
            gap: 3px;
            flex-shrink: 0;
        }

        .control-btn {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            cursor: pointer;
        }

        .close { background: #ff5f56; border: 1px solid #e0443e; }
        .minimize { background: #ffbd2e; border: 1px solid #dea123; }
        .maximize { background: #27c93f; border: 1px solid #1aab29; }

        .tab-btn {
            position: relative;
            background: rgba(220, 228, 212, 0.42);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-bottom: none;
            padding: 7px 4px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.2px;
            color: #0c2014;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: all 0.2s ease;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            flex: 1 1 0px;
            min-width: 0;
